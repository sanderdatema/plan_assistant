name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    if: github.repository == 'sanderdatema/plan_assistant'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Stable release: publish with latest tag, or just move the tag if already published
            npm publish --provenance 2>&1 || {
              if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                echo "Version ${PKG_VERSION} already published, updating latest dist-tag"
                npm dist-tag add "${PKG_NAME}@${PKG_VERSION}" latest
              else
                exit 1
              fi
            }
          else
            # Alpha publish from main branch
            npm publish --provenance --tag alpha 2>&1 || {
              if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                echo "Version ${PKG_VERSION} already published, updating alpha dist-tag"
                npm dist-tag add "${PKG_NAME}@${PKG_VERSION}" alpha
              else
                exit 1
              fi
            }
          fi
