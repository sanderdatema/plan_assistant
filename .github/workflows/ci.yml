name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no lifecycle script from any dependency runs on CI.
      # esbuild and fsevents declare them; both ship their platform binary in an
      # optional dependency, so the build does not need the scripts. Locally the
      # same holds — npm's allowScripts gate blocks them and the build is green.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
