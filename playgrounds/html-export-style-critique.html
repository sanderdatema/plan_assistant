<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Assistant - HTML Export Style Critique</title>
<style>
  /* ============================================================
     Base / Reset
     ============================================================ */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  .playground-question { font-size: 13px; color: var(--text-muted); font-weight: 400; margin: 4px 0 12px; }

  :root {
    --ui-bg: #0d1117;
    --ui-surface: #161b22;
    --ui-surface2: #1c2129;
    --ui-border: #30363d;
    --ui-text: #e6edf3;
    --text-muted: #8b949e;
    --ui-accent: #58a6ff;
    --ui-amber: #d29922;
    --ui-green: #3fb950;
    --ui-red: #f85149;
    --ui-amber-bg: rgba(210, 153, 34, 0.08);
    --ui-green-bg: rgba(63, 185, 80, 0.08);
    --ui-red-bg: rgba(248, 81, 73, 0.05);
  }

  html, body { height:100%; overflow:hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
    line-height: 1.5;
    display: grid;
    grid-template-columns: 1fr 420px;
    grid-template-rows: 1fr auto auto;
    height: 100vh;
  }

  /* ============================================================
     Scrollbar styling
     ============================================================ */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ============================================================
     Document Panel (left)
     ============================================================ */
  #doc-panel {
    background: var(--ui-bg);
    overflow-y: auto;
    border-right: 1px solid var(--ui-border);
    display: flex;
    flex-direction: column;
  }

  #doc-header {
    padding: 16px 20px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  #doc-header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  #doc-header h1 span {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 13px;
    margin-left: 8px;
  }

  #doc-content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .doc-line {
    display: flex;
    min-height: 24px;
    line-height: 24px;
    font-size: 13px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    cursor: default;
  }

  .doc-line:hover {
    background: rgba(255,255,255,0.02);
  }

  .doc-line .line-num {
    width: 48px;
    min-width: 48px;
    text-align: right;
    padding-right: 12px;
    color: var(--text-muted);
    opacity: 0.4;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    user-select: none;
    line-height: 24px;
  }

  .doc-line .line-content {
    flex: 1;
    padding-right: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Suggestion highlighting on lines */
  .doc-line.suggestion-pending {
    border-left-color: var(--ui-amber);
    background: var(--ui-amber-bg);
  }
  .doc-line.suggestion-approved {
    border-left-color: var(--ui-green);
    background: var(--ui-green-bg);
  }
  .doc-line.suggestion-rejected {
    border-left-color: var(--ui-red);
    background: var(--ui-red-bg);
  }

  .doc-line.highlight-flash {
    background: rgba(88, 166, 255, 0.12) !important;
    transition: background 0s;
  }

  /* ============================================================
     Rendered HTML Preview inside document lines
     ============================================================ */
  .rendered-block {
    padding: 4px 0;
  }

  .rendered-block .export-header {
    font-size: 22px;
    font-weight: 700;
    color: #cdd6f4;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .export-status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }

  .rendered-block .export-subtitle {
    font-size: 13px;
    color: #6b7280;
    margin-top: 2px;
  }

  .rendered-block .export-section-title {
    font-size: 15px;
    font-weight: 600;
    color: #a6adc8;
    margin: 4px 0;
  }

  .rendered-block .export-paragraph {
    font-size: 13px;
    color: #a6adc8;
    line-height: 1.5;
  }

  .export-phase-card {
    background: #181825;
    border: 1px solid #313244;
    border-radius: 8px;
    padding: 14px 16px;
    margin: 4px 0;
  }

  .export-phase-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .export-phase-heading h3 {
    font-size: 16px;
    font-weight: 600;
    color: #cdd6f4;
  }

  .export-change-block {
    background: #1e1e2e;
    border-radius: 6px;
    padding: 10px 12px;
    margin: 6px 0;
  }

  .export-change-block h4 {
    font-size: 13px;
    font-weight: 600;
    color: #cdd6f4;
    margin-bottom: 4px;
  }

  .export-change-block .filepath {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: #89b4fa;
    margin-bottom: 4px;
  }

  .export-change-block .desc {
    font-size: 12px;
    color: #bac2de;
  }

  .export-code-pre {
    background: #11111b;
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: #cdd6f4;
    overflow-x: auto;
    margin-top: 6px;
    white-space: pre;
    line-height: 1.4;
  }

  .export-criteria-list {
    padding-left: 18px;
    margin-top: 6px;
    font-size: 12px;
    color: #bac2de;
  }

  .export-criteria-list li {
    margin: 2px 0;
  }

  .export-criteria-list code {
    background: #1e1e2e;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .export-mermaid-box {
    background: #fff;
    padding: 14px;
    border-radius: 6px;
    margin: 4px 0;
    text-align: center;
    color: #333;
    font-size: 13px;
  }

  .export-comment-item {
    margin: 4px 0;
    padding: 8px 12px;
    border-left: 3px solid #60a5fa;
    background: rgba(96,165,250,0.1);
    border-radius: 0 4px 4px 0;
    font-size: 12px;
  }

  .export-comment-item .quote {
    font-style: italic;
    color: #9ca3af;
    margin-bottom: 3px;
  }

  .export-comment-item .body {
    color: #cdd6f4;
  }

  .export-comment-item .meta {
    font-size: 11px;
    color: #6b7280;
    margin-top: 3px;
  }

  .export-footer {
    font-size: 12px;
    color: #6b7280;
    padding-top: 12px;
    border-top: 1px solid #313244;
    margin-top: 8px;
  }

  .export-css-var-block {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #cdd6f4;
  }

  .export-css-var-block .prop { color: #89b4fa; }
  .export-css-var-block .val { color: #a6e3a1; }
  .export-css-var-block .comment { color: #6c7086; font-style: italic; }

  /* ============================================================
     Suggestions Panel (right)
     ============================================================ */
  #suggestions-panel {
    background: var(--ui-surface);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #suggestions-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--ui-border);
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ui-surface);
  }

  #suggestions-header h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  #suggestion-stats {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
  }

  #suggestion-stats .stat-pending { color: var(--ui-amber); }
  #suggestion-stats .stat-approved { color: var(--ui-green); }
  #suggestion-stats .stat-rejected { color: var(--ui-red); }

  .filter-tabs {
    display: flex;
    gap: 2px;
    background: var(--ui-bg);
    border-radius: 8px;
    padding: 3px;
  }

  .filter-tab {
    flex: 1;
    text-align: center;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    background: transparent;
    border: none;
    transition: all 0.15s;
  }

  .filter-tab:hover {
    color: var(--ui-text);
    background: rgba(255,255,255,0.04);
  }

  .filter-tab.active {
    color: var(--ui-text);
    background: var(--ui-surface2);
  }

  #suggestions-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .suggestion-card {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    padding: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .suggestion-card:hover {
    border-color: rgba(88,166,255,0.3);
  }

  .suggestion-card.status-pending { border-left: 3px solid var(--ui-amber); }
  .suggestion-card.status-approved { border-left: 3px solid var(--ui-green); }
  .suggestion-card.status-rejected { border-left: 3px solid var(--ui-red); }

  .suggestion-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .suggestion-line-ref {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--ui-accent);
    cursor: pointer;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(88,166,255,0.1);
    text-decoration: none;
    transition: background 0.15s;
  }

  .suggestion-line-ref:hover {
    background: rgba(88,166,255,0.2);
  }

  .category-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .category-consistency {
    color: #d2a8ff;
    background: rgba(210,168,255,0.12);
  }

  .category-accessibility {
    color: #79c0ff;
    background: rgba(121,192,255,0.12);
  }

  .category-performance {
    color: #ffa657;
    background: rgba(255,166,87,0.12);
  }

  .category-completeness {
    color: #7ee787;
    background: rgba(126,231,135,0.12);
  }

  .suggestion-status-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: auto;
  }

  .status-badge-pending { color: var(--ui-amber); background: rgba(210,153,34,0.15); }
  .status-badge-approved { color: var(--ui-green); background: rgba(63,185,80,0.15); }
  .status-badge-rejected { color: var(--ui-red); background: rgba(248,81,73,0.15); }

  .suggestion-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ui-text);
  }

  .suggestion-text {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .suggestion-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .suggestion-actions button {
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--ui-border);
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .suggestion-actions button:hover {
    background: rgba(255,255,255,0.05);
    color: var(--ui-text);
  }

  .btn-approve:hover, .btn-approve.active {
    border-color: var(--ui-green) !important;
    color: var(--ui-green) !important;
    background: rgba(63,185,80,0.1) !important;
  }

  .btn-reject:hover, .btn-reject.active {
    border-color: var(--ui-red) !important;
    color: var(--ui-red) !important;
    background: rgba(248,81,73,0.1) !important;
  }

  .btn-reset:hover {
    border-color: var(--text-muted) !important;
    color: var(--ui-text) !important;
  }

  .suggestion-comment {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--ui-border);
    background: var(--ui-surface);
    color: var(--ui-text);
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 32px;
    max-height: 100px;
    transition: border-color 0.15s;
  }

  .suggestion-comment::placeholder {
    color: var(--text-muted);
    opacity: 0.5;
  }

  .suggestion-comment:focus {
    outline: none;
    border-color: var(--ui-accent);
  }

  .suggestion-card.hidden {
    display: none;
  }

  /* ============================================================
     Prompt Output (bottom)
     ============================================================ */
  #prompt-panel {
    grid-column: 1 / -1;
    background: var(--ui-surface);
    border-top: 1px solid var(--ui-border);
    display: flex;
    flex-direction: column;
    max-height: 280px;
    min-height: 50px;
  }

  #prompt-header {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--ui-border);
    flex-shrink: 0;
  }

  #prompt-header h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--ui-text);
  }

  #prompt-toggle {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--ui-border);
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
    margin-right: 8px;
  }

  #prompt-toggle:hover {
    color: var(--ui-text);
    background: rgba(255,255,255,0.05);
  }

  #copy-btn {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--ui-accent);
    background: rgba(88,166,255,0.1);
    color: var(--ui-accent);
    transition: all 0.15s;
  }

  #copy-btn:hover {
    background: rgba(88,166,255,0.2);
  }

  #copy-btn.copied {
    border-color: var(--ui-green);
    background: rgba(63,185,80,0.15);
    color: var(--ui-green);
  }

  #prompt-output {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-muted);
    white-space: pre-wrap;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    cursor: text;
  }
  #prompt-output:focus {
    outline: 1px solid #58a6ff;
    outline-offset: 2px;
  }
  .prompt-editable-hint {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 20px 8px;
    flex-shrink: 0;
  }

  #prompt-output .prompt-heading {
    color: var(--ui-text);
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }

  #prompt-output .prompt-approved {
    color: var(--ui-green);
  }

  #prompt-output .prompt-declined {
    color: var(--ui-red);
    opacity: 0.7;
  }

  #prompt-output .prompt-note {
    color: var(--ui-amber);
  }

  #prompt-panel.collapsed #prompt-output {
    display: none;
  }

  #prompt-panel.collapsed {
    min-height: auto;
    max-height: none;
  }

  /* Findings */
  .findings-panel {
    grid-column: 1 / -1;
    padding: 16px 24px; border-top: 1px solid var(--ui-border); background: var(--ui-surface);
    max-height: 50vh; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .findings-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .findings-header h3 {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .findings-actions { display: flex; gap: 6px; }
  .findings-actions .findings-btn {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }
  .findings-actions .findings-btn:hover { opacity: 0.85; }
  .add-finding-row {
    display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px;
  }
  .add-finding-row textarea {
    flex: 1; padding: 8px 10px;
    border: 1px solid var(--ui-border); border-radius: 6px;
    background: var(--ui-bg); color: var(--ui-text); font-family: inherit;
    font-size: 13px; resize: none; min-height: 36px;
  }
  .add-finding-row textarea:focus { outline: none; border-color: var(--ui-accent); }
  .add-finding-row textarea::placeholder { color: #484f58; }
  .add-btn {
    padding: 8px 16px; border: 1px solid var(--ui-accent); border-radius: 6px;
    background: rgba(88, 166, 255, 0.1); color: var(--ui-accent); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .add-btn:hover { background: var(--ui-accent); color: white; }
  .add-btn:disabled { opacity: 0.3; cursor: default; }
  .findings-list {
    overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px;
  }
  .finding-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 10px; background: var(--ui-bg); border-radius: 6px;
    border: 1px solid rgba(48, 54, 61, 0.5); font-size: 12px;
  }
  .finding-summary {
    flex: 1; color: var(--ui-text); font-family: monospace; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 400px;
  }
  .finding-note { color: var(--text-muted); flex: 1; font-style: italic; font-size: 12px; }
  .finding-remove {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 14px; padding: 0 4px; line-height: 1;
  }
  .finding-remove:hover { color: var(--ui-red); }

  /* ============================================================
     Presets Bar
     ============================================================ */
  .presets-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 20px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
    position: sticky;
    top: 61px; /* height of #doc-header */
    z-index: 9;
    flex-shrink: 0;
  }

  .presets-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    align-self: center;
    margin-right: 4px;
    white-space: nowrap;
  }

  .preset-btn {
    background: var(--ui-bg);
    color: var(--text-muted);
    border: 1px solid var(--ui-border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.1s;
    white-space: nowrap;
  }

  .preset-btn:hover {
    border-color: var(--ui-accent);
    color: var(--ui-accent);
  }

  .preset-btn.active {
    background: rgba(88, 166, 255, 0.12);
    border-color: var(--ui-accent);
    color: var(--ui-accent);
  }

  .findings-prompt {
    margin-top: 10px; padding: 10px;
    background: var(--ui-bg); border-radius: 6px;
    border: 1px solid rgba(48, 54, 61, 0.5);
    font-family: monospace; font-size: 11px; line-height: 1.6;
    color: var(--text-muted); white-space: pre-wrap;
    max-height: 150px; overflow-y: auto;
  }
  .finding-count {
    font-size: 11px; color: var(--text-muted); font-weight: 400;
  }
</style>
</head>
<body>

<!-- ============================================================
     Document Panel (Left)
     ============================================================ -->
<div id="doc-panel">
  <div id="doc-header">
    <h1>Export Preview <span>export-html.ts output</span></h1>
    <p class="playground-question">I've identified potential style improvements for the HTML export. Review each suggestion — approve, reject, or add comments. I'll apply only the ones you approve to export-html.ts.</p>
  </div>
  <div class="presets-bar">
    <span class="presets-label">Preset:</span>
    <button class="preset-btn" data-preset="darkTheme">Dark Theme Export</button>
    <button class="preset-btn" data-preset="corporateReport">Corporate Report</button>
    <button class="preset-btn" data-preset="marketingPage">Marketing Page</button>
    <button class="preset-btn" data-preset="technicalDocs">Technical Docs</button>
  </div>
  <div id="doc-content"></div>
</div>

<!-- ============================================================
     Suggestions Panel (Right)
     ============================================================ -->
<div id="suggestions-panel">
  <div id="suggestions-header">
    <h2>Style Critique</h2>
    <div id="suggestion-stats"></div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>

// ================================================================
// Build line-to-suggestion mapping
// ================================================================

function getLineSuggestions(lineNum) {
  const result = [];
  for (const s of suggestions) {
    if (!s.lines) continue;
    if (lineNum >= s.lines[0] && lineNum <= s.lines[1]) {
      result.push(s);
    }
  }
  return result;
}

function getLineStatus(lineNum) {
  const matched = getLineSuggestions(lineNum);
  if (matched.length === 0) return null;
  // Priority: pending > approved > rejected
  if (matched.some(s => s.status === 'pending')) return 'pending';
  if (matched.some(s => s.status === 'approved')) return 'approved';
  return 'rejected';
}

// ================================================================
// Render Document
// ================================================================

function renderDocument() {
  const container = document.getElementById('doc-content');
  container.innerHTML = '';

  for (const line of docLines) {
    const div = document.createElement('div');
    div.className = 'doc-line';
    div.dataset.lineNum = line.lineNum;

    const status = getLineStatus(line.lineNum);
    if (status) {
      div.classList.add('suggestion-' + status);
    }

    const numSpan = document.createElement('span');
    numSpan.className = 'line-num';
    numSpan.textContent = line.lineNum;
    div.appendChild(numSpan);

    const contentSpan = document.createElement('span');
    contentSpan.className = 'line-content';
    if (line.blank) {
      contentSpan.innerHTML = '&nbsp;';
    } else {
      contentSpan.innerHTML = line.html;
    }
    div.appendChild(contentSpan);

    container.appendChild(div);
  }
}

// ================================================================
// Render Suggestions
// ================================================================

let activeFilter = 'all';

function renderSuggestions() {
  const list = document.getElementById('suggestions-list');
  list.innerHTML = '';

  for (const s of suggestions) {
    const card = document.createElement('div');
    card.className = `suggestion-card status-${s.status}`;
    card.dataset.id = s.id;
    card.dataset.status = s.status;

    if (activeFilter !== 'all' && s.status !== activeFilter) {
      card.classList.add('hidden');
    }

    const lineRef = s.lines
      ? `<a class="suggestion-line-ref" data-lines="${s.lines[0]}-${s.lines[1]}">${s.lines[0] === s.lines[1] ? 'L' + s.lines[0] : 'L' + s.lines[0] + '-' + s.lines[1]}</a>`
      : '<span class="suggestion-line-ref" style="opacity:0.4;cursor:default">Global</span>';

    const statusBadgeClass = 'status-badge-' + s.status;
    const statusLabel = s.status.charAt(0).toUpperCase() + s.status.slice(1);

    card.innerHTML = `
      <div class="suggestion-card-header">
        ${lineRef}
        <span class="category-badge category-${s.category}">${s.category}</span>
        <span class="suggestion-status-badge ${statusBadgeClass}">${statusLabel}</span>
      </div>
      <div class="suggestion-title">${s.title}</div>
      <div class="suggestion-text">${s.text}</div>
      <div class="suggestion-actions">
        <button class="btn-approve ${s.status === 'approved' ? 'active' : ''}" data-id="${s.id}">Approve</button>
        <button class="btn-reject ${s.status === 'rejected' ? 'active' : ''}" data-id="${s.id}">Reject</button>
        <button class="btn-reset" data-id="${s.id}">Reset</button>
      </div>
      <textarea class="suggestion-comment" data-id="${s.id}" placeholder="Add a note (optional)..." rows="1">${s.comment}</textarea>
    `;

    list.appendChild(card);
  }

  // Bind action buttons
  list.querySelectorAll('.btn-approve').forEach(btn => {
    btn.addEventListener('click', () => setStatus(parseInt(btn.dataset.id), 'approved'));
  });
  list.querySelectorAll('.btn-reject').forEach(btn => {
    btn.addEventListener('click', () => setStatus(parseInt(btn.dataset.id), 'rejected'));
  });
  list.querySelectorAll('.btn-reset').forEach(btn => {
    btn.addEventListener('click', () => setStatus(parseInt(btn.dataset.id), 'pending'));
  });

  // Bind comments
  list.querySelectorAll('.suggestion-comment').forEach(ta => {
    ta.addEventListener('input', () => {
      const s = suggestions.find(s => s.id === parseInt(ta.dataset.id));
      if (s) { s.comment = ta.value; renderPrompt(); }
    });
  });

  // Bind line references
  list.querySelectorAll('.suggestion-line-ref[data-lines]').forEach(ref => {
    ref.addEventListener('click', (e) => {
      e.preventDefault();
      const [startStr] = ref.dataset.lines.split('-');
      const startLine = parseInt(startStr);
      scrollToLine(startLine);
    });
  });

  updateStats();
}

function setStatus(id, status) {
  const s = suggestions.find(s => s.id === id);
  if (s) {
    s.status = status;
    renderSuggestions();
    renderDocument();
    renderPrompt();
  }
}

function updateStats() {
  const pending = suggestions.filter(s => s.status === 'pending').length;
  const approved = suggestions.filter(s => s.status === 'approved').length;
  const rejected = suggestions.filter(s => s.status === 'rejected').length;

  document.getElementById('suggestion-stats').innerHTML =
    `<span class="stat-pending">${pending} Pending</span>` +
    `<span style="color:var(--ui-border)">|</span>` +
    `<span class="stat-approved">${approved} Approved</span>` +
    `<span style="color:var(--ui-border)">|</span>` +
    `<span class="stat-rejected">${rejected} Rejected</span>`;
}

function scrollToLine(lineNum) {
  const docContent = document.getElementById('doc-content');
  const line = docContent.querySelector(`.doc-line[data-line-num="${lineNum}"]`);
  if (!line) return;

  line.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Flash highlight
  line.classList.add('highlight-flash');
  setTimeout(() => {
    line.classList.remove('highlight-flash');
  }, 1200);
}

// ================================================================
// Filter Tabs
// ================================================================

document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    renderSuggestions();
  });
});

// ================================================================
// Prompt Output
// ================================================================

function renderPrompt() {
  const approved = suggestions.filter(s => s.status === 'approved');
  const rejected = suggestions.filter(s => s.status === 'rejected');
  const commented = suggestions.filter(s => s.status === 'pending' && s.comment.trim());

  let lines = [];

  lines.push('Please update the HTML export in `src/cli/export-html.ts` with the following improvements:');
  lines.push('');

  if (approved.length > 0) {
    lines.push('## Approved Changes');
    lines.push('');
    for (const s of approved) {
      const lineRef = s.lines ? ` (Lines ${s.lines[0]}-${s.lines[1]})` : '';
      lines.push(`**${s.title}**${lineRef}: ${s.text.split('.')[0]}.`);
      if (s.comment.trim()) {
        lines.push(`  -> User note: ${s.comment.trim()}`);
      }
      lines.push('');
    }
  }

  if (commented.length > 0) {
    lines.push('## Additional Notes');
    lines.push('');
    for (const s of commented) {
      const lineRef = s.lines ? ` (Line ${s.lines[0]})` : '';
      lines.push(`**${s.title}**${lineRef}: User commented: ${s.comment.trim()}`);
      lines.push('');
    }
  }

  if (rejected.length > 0) {
    lines.push('## Declined');
    for (const s of rejected) {
      const reason = s.comment.trim() ? ` \u2014 ${s.comment.trim()}` : '';
      lines.push(`- ${s.title}${reason}`);
    }
    lines.push('');
  }

  if (approved.length === 0 && rejected.length === 0 && commented.length === 0) {
    lines.push('(No suggestions reviewed yet. Approve or reject suggestions to build the prompt.)');
  }

  lines.push('');
  lines.push('[Playground: HTML Export Style Critique]');

  const container = document.getElementById('prompt-output');
  container.innerHTML = '';

  const raw = lines.join('\n');

  // Simple rendering with colored sections
  const htmlOut = raw
    .replace(/^## (Approved Changes)$/gm, '<span class="prompt-heading prompt-approved">## $1</span>')
    .replace(/^## (Additional Notes)$/gm, '<span class="prompt-heading prompt-note">## $1</span>')
    .replace(/^## (Declined)$/gm, '<span class="prompt-heading prompt-declined">## $1</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:rgba(88,166,255,0.1);padding:1px 5px;border-radius:3px;font-size:11px">$1</code>')
    .replace(/^  -> (.+)$/gm, '  <span style="color:var(--ui-accent)">-> $1</span>');

  container.innerHTML = htmlOut;

  // Store raw text for copy
  container.dataset.raw = raw;
}

// ================================================================
// Copy Button
// ================================================================

document.getElementById('copy-btn').addEventListener('click', () => {
  const raw = document.getElementById('prompt-output').textContent || '';
  navigator.clipboard.writeText(raw).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
});

// ================================================================
// Prompt Toggle
// ================================================================

document.getElementById('prompt-toggle').addEventListener('click', () => {
  const panel = document.getElementById('prompt-panel');
  const btn = document.getElementById('prompt-toggle');
  panel.classList.toggle('collapsed');
  btn.textContent = panel.classList.contains('collapsed') ? 'Expand' : 'Collapse';
});

// ================================================================
// Preset System
// ================================================================

function applyPreset(key) {
  const preset = PRESETS[key];
  if (!preset) return;

  activePreset = key;

  // Deep-clone the preset's suggestions so edits don't mutate PRESETS
  suggestions.length = 0;
  for (const s of preset.suggestions) {
    suggestions.push({ ...s });
  }

  // Replace docLines
  docLines.length = 0;
  for (const l of preset.docLines) {
    docLines.push({ ...l });
  }

  // Update header text
  document.querySelector('#doc-header h1').innerHTML =
    `Export Preview <span>${preset.subtitle}</span>`;
  document.querySelector('#doc-header .playground-question').textContent =
    preset.question;

  // Re-render everything
  activeFilter = 'all';
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === 'all'));
  renderDocument();
  renderSuggestions();
  renderPrompt();

  // Update preset button active state
  updatePresetButtons();
}

function updatePresetButtons() {
  document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.preset === activePreset);
  });
}

// Bind preset buttons
document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
});

// ================================================================
// Initialize with default preset
// ================================================================

applyPreset('darkTheme');

// --- Findings accumulator ---
let findings = [];

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function addFinding() {
  const promptEl = document.getElementById('prompt-output');
  const promptText = (promptEl.innerText || promptEl.textContent || '').trim();
  if (!promptText) return;

  const note = document.getElementById('finding-note').value.trim();

  findings.push({
    prompt: promptText,
    note: note || null,
    timestamp: new Date().toLocaleTimeString()
  });

  document.getElementById('finding-note').value = '';
  renderFindings();
}

function removeFinding(i) {
  findings.splice(i, 1);
  renderFindings();
}

function clearFindings() {
  if (findings.length > 0 && !confirm('Clear all findings?')) return;
  findings = [];
  renderFindings();
}

function renderFindings() {
  const list = document.getElementById('findings-list');
  const count = document.getElementById('finding-count');
  const promptEl = document.getElementById('findings-prompt');

  count.textContent = findings.length > 0 ? `(${findings.length})` : '';

  if (findings.length === 0) {
    list.innerHTML = '<div style="color: var(--text-muted); font-size: 12px; padding: 8px 0;">No findings yet. Configure the playground and click "+ Add finding" to capture a prompt snapshot.</div>';
    promptEl.style.display = 'none';
    return;
  }

  list.innerHTML = findings.map((f, i) => {
    const summary = f.prompt.substring(0, 80) + (f.prompt.length > 80 ? '...' : '');
    const noteHtml = f.note
      ? `<span class="finding-note">${escapeHtml(f.note)}</span>`
      : '<span class="finding-note" style="opacity:0.4;">no note</span>';
    return `<div class="finding-item">
      <span class="finding-summary" title="${escapeHtml(f.prompt)}">${escapeHtml(summary)}</span>
      ${noteHtml}
      <button class="finding-remove" onclick="removeFinding(${i})" title="Remove">\u00d7</button>
    </div>`;
  }).join('');

  const lines = findings.map((f, i) => {
    let line = `${i + 1}. ${f.prompt}`;
    if (f.note) line += `\n   Note: ${f.note}`;
    return line;
  });

  promptEl.style.display = 'block';
  promptEl.textContent = `I have ${findings.length} configuration(s) to apply:\n\n${lines.join('\n\n')}`;
}

function copyFindings() {
  const promptEl = document.getElementById('findings-prompt');
  const text = (promptEl.innerText || promptEl.textContent || '').trim() || 'Add findings first.';
  navigator.clipboard.writeText(text).then(() => {
    const btns = document.querySelectorAll('.findings-actions .findings-btn');
    const btn = btns[btns.length - 1];
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

document.getElementById('finding-note').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addFinding();
  }
});

renderFindings();
</script>
